<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
    .card { max-width: 720px; padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
    p { color: #374151; }
    a.button { display: inline-block; margin-top: 1rem; background: #111827; color: #fff; padding: 0.6rem 1rem; border-radius: 8px; text-decoration: none; }
    a.button:hover { background: #0b1220; }
    code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Static File Served</h1>
    <p>This page is served from the server's static directory.</p>
    <p>Try generating a sample document via <code>/generate_doc</code>.</p>
    <a class="button" href="/generate_doc" target="_blank">Generate Sample Document</a>
  </div>
</body>
</html>
